<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sama_Amr | Sweet 16</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Background Floating Elements -->
  <div class="floating-hearts"></div>

  <!-- Hero Section -->
  <header class="hero">
    <div class="hero-content">
      <span class="badge">👑 Sweet Sixteen</span>
      <h1 class="title">Happy Birthday <br><span class="highlight">Sama Amr</span></h1>
      <p class="subtitle">كل سنة وأنتي أجمل وأغلى الناس ♡</p>
    </div>
  </header>

  <!-- Gallery Section -->
  <section class="memories-section">
    <div class="section-title">
      <span class="sub-heading">MY MEMORIES 👑</span>
      <h2>شوية من ذكرياتي ✨</h2>
      <p>كل صورة لحظة، وكل لحظة حكاية صغيرة من حكايتي.</p>
    </div>

    <div class="gallery-grid">
      <figure class="photo tall">
        <img src="./images/photo1.jpg" alt="Memory 1">
        <figcaption>✨ Little moment</figcaption>
      </figure>

      <figure class="photo wide">
        <img src="./images/photo2.jpg" alt="Memory 2">
        <figcaption>💖 Sweet memory</figcaption>
      </figure>

      <figure class="photo">
        <img src="./images/photo3.jpg" alt="Memory 3">
        <figcaption>🌸 Smile forever</figcaption>
      </figure>

      <figure class="photo">
        <img src="./images/photo4.jpg" alt="Memory 4">
        <figcaption>✨ Best day</figcaption>
      </figure>

      <figure class="photo wide">
        <img src="./images/photo5.jpg" alt="Memory 5">
        <figcaption>👑 Special time</figcaption>
      </figure>

      <figure class="photo tall">
        <img src="./images/photo6.jpg" alt="Memory 6">
        <figcaption>♡ Unforgettable</figcaption>
      </figure>
    </div>
  </section>

  <!-- Wishes / Message Section -->
  <section class="wishes-section">
    <div class="card-wish">
      <h3>رسالة خاصة 💌</h3>
      <p>
        كل سنة وأنتي بتمثلي أجمل حاجة في حياتنا، عقبال 100 سنة مليانة نجاح وفرحة وضحك وسعادة مابتنتهيش! 🎈🎉
      </p>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>Made with ❤️ for Sama Amr</p>
  </footer>

</body>
</html>
